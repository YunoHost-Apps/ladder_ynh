#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "ladder"
name = "Ladder"
description.en = "Bypass paywalls as 12ft.io does"
description.fr = "Contourner les paywall comme le fait 12ft.io"

version = "0.0.23~ynh1"

maintainers = ["Gildas-GH"]

[upstream]
license = "GPL-3.0-only"
code = "https://github.com/everywall/ladder"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = ["amd64", "i386", "arm64"]
multi_instance = true

ldap = "not_relevant"
sso = "not_relevant"

disk = "20M"
ram.build = "20M"
ram.runtime = "20M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "all_users"

    [install.ruleset]
    type = "url"
    default = "https://raw.githubusercontent.com/everywall/ladder-rules/main/ruleset.yaml"
    ask.fr = "URL vers un set de règles"
    help.fr = "Il est conseillé de garder l'URL par défaut"
    ask.en = "URL to a ruleset"
    help.en = "It is advised to keep the default URL"

[resources]

    [resources.sources]

        [resources.sources.main]
        i386.url = "https://github.com/everywall/ladder/releases/download/v0.0.23/ladder_linux_386.tar.gz"
        i386.sha256 = "fcde7f4ab5849d540e67028c02f93f9ab7b0c1381642c488920fce305ca00a84"
        amd64.url = "https://github.com/everywall/ladder/releases/download/v0.0.23/ladder_linux_amd64.tar.gz"
        amd64.sha256 = "48605de5dd2021fe875ff064da02ba1807bf7c2d4e020714e25747931c279dd8"
        arm64.url = "https://github.com/everywall/ladder/releases/download/v0.0.23/ladder_linux_arm64.tar.gz"
        arm64.sha256 = "2fe3334ba017ccff4114bfe210895fb12a05dcb1d0c81a7d8e56182adb002858"
        in_subdir = false
        
        autoupdate.strategy = "latest_github_release"
        autoupdate.asset.i386 = "^ladder_linux_386.tar.gz$"
        autoupdate.asset.amd64 = "^ladder_linux_amd64.tar.gz$"
        autoupdate.asset.arm64 = "^ladder_linux_arm64.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
